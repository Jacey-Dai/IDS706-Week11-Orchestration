name: week11-bikes
x-common: &common
  build:
    context: ..
    dockerfile: week11/Dockerfile
  environment: &env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /repo/bikeshare/dags
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    PYTHONPATH: /repo
    BIKE_DATABASE_URL: postgresql+psycopg2://airflow:airflow@postgres/bikeshare
    OPENROUTER_API_KEY: ''
    CURSOR_API_KEY: ''
  volumes:
    - ..:/repo
    - airflow_logs:/opt/airflow/logs
  user: '0:0'
  depends_on:
    postgres:
      condition: service_healthy
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-bike.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airflow']
      interval: 5s
      timeout: 5s
      retries: 20
  init:
    <<: *common
    entrypoint: /bin/bash
    command: ['-c', 'airflow db migrate && (airflow users list | grep -q admin || airflow users create --username admin --password admin --firstname Jacey --lastname Dai --role Admin --email admin@example.test)']
  webserver:
    <<: *common
    command: webserver
    ports: ['127.0.0.1:8089:8080']
    depends_on:
      init:
        condition: service_completed_successfully
  scheduler:
    <<: *common
    command: scheduler
    depends_on:
      init:
        condition: service_completed_successfully
  dashboard:
    <<: *common
    entrypoint: ['streamlit', 'run', '/repo/bikeshare/dashboard.py', '--server.address=0.0.0.0', '--server.port=8501']
    ports: ['127.0.0.1:8502:8501']
volumes:
  postgres_data:
  airflow_logs:
